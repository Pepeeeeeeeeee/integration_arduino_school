[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf

; --- Serial monitor & flashing ---
upload_speed = 921600
monitor_speed = 115200
monitor_filters = time, colorize

; --- Optional: partition layout ---
board_build.partitions = default.csv

; --- Compiler settings ---
build_type = debug
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
